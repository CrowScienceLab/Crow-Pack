[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crow-pack"
version = "1.1.0"
description = "Windows desktop archive manager with Korean filename support"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6>=6.11.2,<6.12",
  "chardet>=7.6.0,<8",
  "py7zr>=1.1.3,<2",
  "pycdlib>=1.20.0,<2",
  "pypdf>=6.16.2,<7",
  "Pillow>=12.3.0,<13",
  "pyzipper>=0.4.0,<0.5",
  "rarfile>=4.5,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]
dev = ["pip-audit>=2.9,<3", "ruff>=0.12,<1"]

[project.gui-scripts]
crow-pack = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"src.ui" = ["*.html", "*.css", "*.js"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]
ignore = ["E501", "S110", "S603", "S606", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
